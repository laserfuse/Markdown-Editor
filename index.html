<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prévisualisez vos fichiers README Markdown avec un rendu inspiré de GitHub."
    />
    <link rel="icon" type="image/png" href="./markdown-editor-logo.png" />
    <title>Markdown Editor</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Markdown Editor, accueil">
          <img class="brand-logo" src="./site-logo.png" alt="" />
        </a>
        <div class="topbar-actions">
          <a class="button guide-link" href="./badges.html" aria-label="Badges README">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.25A2.25 2.25 0 0 1 5.25 4h9.5A2.25 2.25 0 0 1 17 6.25v7.5A2.25 2.25 0 0 1 14.75 16h-9.5A2.25 2.25 0 0 1 3 13.75v-7.5Z" /><path d="M7 8h2.5M10.5 12h2.5" /></svg>
            Badges
          </a>
          <a class="button guide-link" href="./guide.html" aria-label="Guide Markdown">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5A1.5 1.5 0 0 1 5 3h10a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 0 15 14H5a1.5 1.5 0 0 0-1.5 1.5v-11Z" /><path d="M3.5 15.5A1.5 1.5 0 0 1 5 14h11.5M7 6h6M7 9h6" /></svg>
            Guide Markdown
          </a>
          <button class="button button-quiet" id="open-button" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h4l1.5 1.75H16A1.5 1.5 0 0 1 17.5 7.25v7.25A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5v-9Z" /><path d="M2.75 8h14.5" /></svg>
            Ouvrir un fichier
          </button>
          <button class="button button-primary" id="download-button" type="button" title="Télécharger le README">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75v9m0 0 3.25-3.25M10 11.75 6.75 8.5M3.5 13.25v2A1.75 1.75 0 0 0 5.25 17h9.5a1.75 1.75 0 0 0 1.75-1.75v-2" /></svg>
            Télécharger
          </button>
          <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="panels" aria-label="Éditeur et aperçu Markdown">
          <div class="panel editor-panel">
            <div class="panel-toolbar">
              <div class="panel-title">
                <span class="file-icon" aria-hidden="true">M</span>
                <span id="filename">README.md</span>
                <span class="edited-indicator" id="edited-indicator" hidden>modifié</span>
              </div>
              <div class="toolbar-actions">
                <button class="icon-button" id="copy-button" type="button" title="Copier le Markdown" aria-label="Copier le Markdown">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="6" width="9" height="11" rx="1.5" /><path d="M13 6V4.75A1.75 1.75 0 0 0 11.25 3h-7.5A1.75 1.75 0 0 0 2 4.75v8.5A1.75 1.75 0 0 0 3.75 15H7" /></svg>
                  <span class="sr-only">Copier le Markdown</span>
                </button>
                <button class="icon-button" id="reset-button" type="button" title="Réinitialiser l’exemple" aria-label="Réinitialiser l’exemple">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.25 10a6.75 6.75 0 1 0 1.8-4.58L3.25 7.25" /><path d="M3.25 3.75v3.5h3.5" /></svg>
                  <span class="sr-only">Réinitialiser l’exemple</span>
                </button>
              </div>
            </div>
            <div class="editor-wrap" id="editor-wrap">
              <textarea
                id="markdown-input"
                aria-label="Contenu Markdown"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
              ></textarea>
              <div class="drop-overlay" id="drop-overlay">Déposez votre fichier Markdown ici</div>
            </div>
            <div class="panel-footer">
              <span><kbd>Markdown</kbd> pris en charge</span>
              <span id="editor-stats">0 lignes · 0 mots</span>
            </div>
          </div>

          <div class="panel preview-panel">
            <div class="panel-toolbar">
              <div class="panel-title">
                <svg class="preview-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.25 10s2.8-5 7.75-5 7.75 5 7.75 5-2.8 5-7.75 5-7.75-5-7.75-5Z" /><circle cx="10" cy="10" r="2" /></svg>
                <span>Aperçu</span>
              </div>
              <div class="preview-toolbar-actions">
                <button class="button preview-mode-button" id="preview-mode-button" type="button" aria-pressed="false">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.25 3.5H3.5v3.75M12.75 3.5h3.75v3.75M16.5 12.75v3.75h-3.75M7.25 16.5H3.5v-3.75" /></svg>
                  <span>Plein écran</span>
                </button>
              </div>
            </div>
            <div class="preview-scroll" id="preview-scroll">
              <article class="markdown-body" id="markdown-preview" aria-live="polite"></article>
            </div>
            <div class="panel-footer preview-footer">
              <span>Rendu en direct</span>
              <span class="render-status"><span></span> À jour</span>
            </div>
          </div>
        </section>
        <p class="drop-hint">Astuce : vous pouvez aussi glisser-déposer un fichier <code>.md</code> dans l’éditeur.</p>
      </main>
      <footer class="site-footer">
        <span>© 2026 Markdown Editor</span>
        <span aria-hidden="true">·</span>
        <a href="./guide.html">Guide Markdown</a>
        <span aria-hidden="true">·</span>
        <a href="./badges.html">Badges</a>
        <span aria-hidden="true">·</span>
        <a href="./licence.html">Licence CC BY-NC 4.0</a>
      </footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
